# Hardware commissioning profile; do not replace your simulation tuning with this.
# Inertia starts uncompensated; apply an accepted fitted result before normal operation.
controller_manager:
  ros__parameters:
    update_rate: 1000
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    load_cell_broadcaster:
      type: force_torque_sensor_broadcaster/ForceTorqueSensorBroadcaster
    zero_force_controller:
      type: zfc_zero_force_controller/ZeroForceController
    calibration_sequencer_controller:
      type: zfc_calibration_controller/CalibrationSequencerController
joint_state_broadcaster:
  ros__parameters:
    joints:
    - carriage
    interfaces:
    - position
    - velocity
load_cell_broadcaster:
  ros__parameters:
    frame_id: load_cell_link
    interface_names:
      force:
        x: load_cell/force.x
        y: load_cell/force.y
        z: load_cell/force.z
zero_force_controller:
  ros__parameters:
    joint_name: carriage
    force_interface: load_cell/force.x
    trial_id: 0
    hold_only: false
    baseline_duration_s: 2.0
    noise_duration_s: 2.0
    acceleration_per_force: 0.02
    force_response_sign: 1
    damping_per_s: 5.0
    inertial_force_coefficient_kg: 0.0
    noise_multiplier: 3.0
    minimum_deadband_n: 0.1
    max_acceleration_mps2: 0.05
    max_velocity_mps: 0.002
    excursion_limit_m: 0.005
    use_position_bounds: false
    lower_position_m: 0.0
    upper_position_m: 0.29
    stationary_velocity_mps: 0.0005
    max_force_n: 100.0
calibration_sequencer_controller:
  ros__parameters:
    joint_name: carriage
    force_interface: load_cell/force.x
    trial_id: 0
    center_zone_half_width_m: 0.0002
    base_velocity_mps: 0.005
    jerk_mps3: 10.0
    initial_acceleration_mps2: 0.05
    acceleration_increment_mps2: 0.05
    max_acceleration_mps2: 0.25
    cycles_per_acceleration_increase: 3
    excursion_limit_m: 0.005
    use_position_bounds: false
    lower_position_m: 0.0
    upper_position_m: 0.29
    settling_acceleration_mps2: 0.05
    settling_timeout_s: 5.0
    stationary_velocity_mps: 0.0005
    tracking_tolerance_m: 0.0005
    stationary_duration_s: 0.3
