# Complete physical overlay, including shared analysis defaults.
# Expected slope sign and quality thresholds are commissioning assumptions, not measurements.
# Review the saved fit before application. Leave unknown downstream mass at -1.
calibration_analysis:
  ros__parameters:
    backend: ethercat
    controller_manager: /controller_manager
    calibration_controller: calibration_sequencer_controller
    zero_force_controller: zero_force_controller
    output_directory: /home/jetson/zfc-calibration-trials
    service_timeout_s: 8.0
    capture_timeout_s: 120.0
    drain_timeout_s: 8.0
    baseline_timeout_s: 15.0
    maximum_samples: 120000
    maximum_gap_s: 0.01
    expected_coefficient_sign: -1
    minimum_acceleration_mps2: 0.04
    maximum_acceleration_mps2: 0.26
    plateau_settle_s: 0.01
    plateau_end_guard_s: 0.005
    reversal_guard_s: 0.01
    minimum_plateau_samples: 8
    minimum_plateaus_per_branch: 3
    minimum_r_squared: 0.9
    maximum_residual_rms_n: 0.1
    maximum_branch_difference_fraction: 0.25
    maximum_coefficient_kg: 20.0
    maximum_tracking_error_m: 0.0005
    maximum_velocity_error_mps: 0.002
    known_downstream_mass_kg: -1.0
    use_sim_time: false
    installation_reviewed: false
    controllers_reviewed: true
    analysis_reviewed: false
    coordinate_convention: Position in metres, positive upward; session startup zero;
      increasing encoder counts move downward; m_per_count=-9.765625e-8.
    force_convention: X force positive for upward external push; +1e-4 N/raw count.
      Trial baseline is subtracted in zero-force control. Y/Z signs unverified. Negative
      acceleration-fit slope is a provisional reaction-force assumption.
    calibration_profile_id: jetson-commissioning-2026-10-14
    feedback_timeout_s: 2.0
    stationary_velocity_mps: 0.0005
